name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Prepare Arch container
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed asar nodejs sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          WORKDIR="$GITHUB_WORKSPACE"
          chown -R builder:builder "$WORKDIR"
          su builder -c "cd '$WORKDIR' && PACKAGER='syu-toutousai <167145022+syu-toutousai@users.noreply.github.com>' makepkg -s --noconfirm"

      - name: Verify Japanese patch
        run: |
          rm -rf verify verify-asar
          mkdir -p verify
          bsdtar -xf mechvibes-*.pkg.tar.zst -C verify
          asar extract verify/opt/Mechvibes/resources/app.asar verify-asar
          node tools/verify-ja.js --dir verify-asar --map ja.json

      - name: Build pacman repository
        run: |
          mkdir -p repo
          cp mechvibes-*.pkg.tar.zst repo/
          repo-add repo/mechvibes-ja.db.tar.gz repo/mechvibes-*.pkg.tar.zst
          cp --remove-destination repo/mechvibes-ja.db.tar.gz repo/mechvibes-ja.db
          cp --remove-destination repo/mechvibes-ja.files.tar.gz repo/mechvibes-ja.files
          sha256sum mechvibes-*.pkg.tar.zst > mechvibes-ja.sha256
          cat mechvibes-ja.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mechvibes-ja
          if-no-files-found: error
          path: |
            mechvibes-*.pkg.tar.zst
            mechvibes-ja.sha256
            repo/mechvibes-ja.db
            repo/mechvibes-ja.db.tar.gz
            repo/mechvibes-ja.files
            repo/mechvibes-ja.files.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: mechvibes-ja
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Mechvibes 2.3.6 日本語版（非公式）

            pacman リポジトリとして利用する場合:

            ```
            [mechvibes-ja]
            SigLevel = Optional TrustAll
            Server = https://github.com/syu-toutousai/mechvibes-ja/releases/latest/download
            ```
          files: |
            dist/mechvibes-*.pkg.tar.zst
            dist/mechvibes-ja.sha256
            dist/repo/mechvibes-ja.db
            dist/repo/mechvibes-ja.db.tar.gz
            dist/repo/mechvibes-ja.files
            dist/repo/mechvibes-ja.files.tar.gz
